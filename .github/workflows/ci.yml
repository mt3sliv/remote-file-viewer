name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ''
permissions:
  contents: read
defaults:
  run:
    shell: pwsh
    working-directory: RemoteFrame
jobs:
  managed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: RemoteFrame/global.json
      - name: Build, test and verify managed packages
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./packaging/Test-Managed.ps1 -Version $env:RELEASE_VERSION
      - name: Verify split dependency restore and publish
        run: ./tests/TestSplitRuntimePackaging.ps1
  windows-runtime:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: RemoteFrame/global.json
      - name: Resolve package version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $version = ./packaging/Get-ReleaseVersion.ps1 $env:RELEASE_VERSION
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v6
        with:
          path: RemoteFrame/artifacts/libreoffice-binary
          key: office-win-x64-${{ hashFiles('RemoteFrame/packaging/libreoffice/binary.lock.json') }}
      - name: Native mouse and modal regressions
        run: ./tests/TestPointerInput.ps1
      - name: Binary provenance regressions
        run: ./tests/TestBinaryBuild.ps1
      - name: Build and test full Windows distribution
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./packaging/Build-Distribution.ps1 -OfficeEngine Binary -PackageVersion $env:RELEASE_VERSION -ManagedPackageVersion $env:RELEASE_VERSION
      - name: Verify packaged demo and complete deployed inventory
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet build src/RemoteFrame.Server -c Release "-p:Version=$env:RELEASE_VERSION" "-p:RemoteFramePackageVersion=$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged demo build failed.' }
          ./tests/TestDemoRuntime.ps1 -Configuration Release -ExpectedPackageVersion $env:RELEASE_VERSION
          dotnet run --project tools/RemoteFrame.RuntimeCheck -c Release -- src/RemoteFrame.Server/bin/Release/net10.0/remote-frame/win-x64 win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Reassembled runtime validation failed.' }
      - name: Record release inventory
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./packaging/New-ReleaseManifest.ps1 -Version $env:RELEASE_VERSION
          ./packaging/Publish-NuGet.ps1 -Version $env:RELEASE_VERSION -ValidateOnly
      - uses: actions/upload-artifact@v7
        with:
          name: nuget-release
          path: |
            RemoteFrame/artifacts/packages/*.nupkg
            RemoteFrame/artifacts/packages/release.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
