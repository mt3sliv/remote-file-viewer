<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RemoteFrame Phase 2 preview</title><style>
:root{color-scheme:dark}body{font-family:system-ui,sans-serif;background:#101723;color:#e7edf9;margin:3rem auto;max-width:1020px;padding:0 1rem}h1{margin-bottom:.2rem}p{color:#acb9ca}section{display:flex;gap:.6rem;flex-wrap:wrap;margin:1rem 0}input,select,button{padding:.7rem;border-radius:.4rem;background:#202f44;border:1px solid #51617b;color:white}button{cursor:pointer}button:hover{background:#324967}canvas{display:block;width:100%;background:#0d1320;border:1px solid #354860;border-radius:.5rem;outline:none}#status{font-size:.9rem} .hidden{display:none}</style></head><body>
<h1>RemoteFrame <small>Phase 2 preview</small></h1><p>Server-side text and LibreOffice application rendering. Only PNG frame pixels reach this browser.</p>
<section id="viewerControls"><select id="files" aria-label="Allowed files"></select><button id="open">Open file</button><button id="save" disabled>Save document</button><button id="close">Close session</button></section>
<section><label>FPS <input id="fps" type="number" min="1" max="30" value="5"></label>
<label>Capture width <input id="captureWidth" type="number" min="320" max="3840" value="1280"></label>
<label>Capture height <input id="captureHeight" type="number" min="200" max="2160" value="800"></label>
<label><input id="fitViewport" type="checkbox" checked> Fit stream to viewport</label><button id="applySettings">Apply settings</button></section>
<p id="status" role="status">Loading sample files�</p>
<canvas id="screen" width="960" height="600" tabindex="0" aria-label="Remote file image" style="touch-action:none"></canvas>
<script src="/viewer.js"></script></body></html>
